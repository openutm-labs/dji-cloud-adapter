[project]
name = "dji-cloud-adaptor"
version = "0.1.0"
description = "DJI Pilot 2 Cloud API telemetry into OpenUTM Flight Blender"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "paho-mqtt>=2.1,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
dji-cloud-adaptor = "dji_cloud_adaptor.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dji_cloud_adaptor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
